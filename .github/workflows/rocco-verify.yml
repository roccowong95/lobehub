name: Rocco verification

on:
  workflow_dispatch: {}
  push:
    branches: [fix/rocco]
    tags: ['rocco-image-*']

permissions:
  contents: read

jobs:
  regression:
    name: Targeted regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install dependencies
        run: |
          npm install --global corepack@latest
          corepack enable
          pnpm install --no-frozen-lockfile
      - name: Run targeted checks
        run: >-
          bun run check --lint --test
          packages/model-runtime/src/providers/siliconcloud/index.ts
          packages/model-runtime/src/providers/siliconcloud/index.test.ts
          apps/server/src/services/taskRunner/index.ts
          apps/server/src/services/taskRunner/runTask.modelSnapshot.test.ts
          apps/server/src/services/aiAgent/subAgentRuns.ts
          apps/server/src/services/aiAgent/__tests__/execSubAgent.test.ts
          apps/server/src/services/aiAgent/__tests__/execGroupMember.test.ts
          apps/server/src/services/agentRuntime/AgentRuntimeService/index.ts
          apps/server/src/modules/AgentRuntime/adapters/ServerLLMTransport.ts
          apps/server/src/modules/AgentRuntime/adapters/serverCallLlmAttempt.ts
          apps/server/src/modules/AgentRuntime/adapters/serverCallLlmAttempt.test.ts
          packages/env/src/app.ts
          packages/agent-runtime/src/utils/tokenCounter.ts
          packages/agent-runtime/src/utils/tokenCounter.test.ts
          packages/agent-runtime/src/agents/GeneralChatAgent.ts
          packages/agent-runtime/src/agents/__tests__/GeneralChatAgent.test.ts
          packages/locales/src/default/setting.ts
          packages/types/src/agentExecution/modelFacts.ts
          apps/server/src/services/aiAgent/pipeline/toolDiscovery/modelFacts.ts
          apps/server/src/services/aiAgent/pipeline/toolDiscovery/index.branches.test.ts
          apps/server/src/services/agentRuntime/AgentRuntimeService/runtimeFactory.ts
          apps/server/src/services/agentRuntime/AgentRuntimeService/__tests__/executeStep.test.ts
          apps/server/src/services/aiAgent/pipeline/startOperation.ts
          apps/server/src/services/aiAgent/pipeline/startOperation.messageProtocol.test.ts
          apps/server/src/services/aiAgent/pipeline/execTurn.ts
          apps/server/src/services/aiAgent/types.ts
          apps/server/src/services/aiAgent/backgroundSubAgentDelivery.ts
          apps/server/src/services/aiAgent/__tests__/backgroundSubAgentDelivery.test.ts
          apps/server/src/services/agentRuntime/AgentRuntimeService/createOperation.ts
          apps/server/src/services/agentRuntime/AgentRuntimeService/subAgentBridge.ts
          apps/server/src/services/agentRuntime/AgentRuntimeService/__tests__/createOperation.test.ts
          apps/server/src/services/agentRuntime/AgentRuntimeService/__tests__/subAgentBridge.test.ts
          apps/server/src/services/taskResultBridge/index.ts
          apps/server/src/routers/lambda/agentNotify.ts
          packages/builtin-tool-lobe-agent/src/types.ts

  image:
    name: Build amd64 image
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    name: Publish amd64 image to ACR
    if: startsWith(github.ref, 'refs/tags/rocco-image-')
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.cn-shenzhen.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: registry.cn-shenzhen.aliyuncs.com/happyfew/lobehub:fix-rocco-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
